<title>Syrup!</title>

<style>
:root{
  color-scheme:dark;
  --bg:#0a0d12; --sky1:#18202b; --sky2:#0a0d12;
  --fg:#e6ebf1; --muted:#8f9bab; --line:rgba(170,190,210,.14);
  --glass:rgba(13,17,24,.58); --blood:#b3121f; --blood2:#e0313f;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;margin:0}
body{
  font-family:var(--sans);font-weight:300;color:var(--fg);line-height:1.7;
  min-height:100vh;display:grid;place-items:center;padding:48px 20px;
  background:linear-gradient(180deg,var(--sky1) 0%,#121922 50%,var(--sky2) 100%);
  overflow-x:hidden;position:relative;
}
.moon{position:fixed;top:9vh;left:62vw;width:22vmin;height:22vmin;border-radius:50%;z-index:0;
  background:radial-gradient(circle,rgba(210,225,240,.22),rgba(210,225,240,.05) 55%,transparent 70%)}
.mtn{position:fixed;left:0;right:0;bottom:0;width:100%;height:58vh;z-index:0;pointer-events:none}
.mist{position:fixed;left:-10%;width:120%;height:34vh;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 30% 50%,rgba(160,185,210,.20),transparent 62%),
             radial-gradient(ellipse at 75% 60%,rgba(160,185,210,.14),transparent 60%);
  filter:blur(18px);animation:mist 46s ease-in-out infinite alternate}
.m1{bottom:14vh}.m2{bottom:-2vh;animation-duration:62s;animation-direction:alternate-reverse;opacity:.9}
@keyframes mist{to{transform:translateX(7%)}}
.ember{position:fixed;inset:auto 0 0 0;height:38vh;z-index:0;pointer-events:none;
  background:linear-gradient(0deg,rgba(130,8,20,.30),transparent)}
body::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.5) 100%)}
.petal{position:fixed;top:-24px;z-index:1;border-radius:80% 0 80% 0;pointer-events:none;
  background:rgba(214,160,182,.5);animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(560deg)}}
.card{
  position:relative;z-index:3;width:100%;max-width:420px;padding:46px 38px 34px;
  background:var(--glass);border:1px solid var(--line);border-radius:22px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 40px 90px -40px rgba(170,10,28,.55),inset 0 -1px 0 rgba(179,18,31,.35);
  animation:rise 1.2s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

.avatar{width:78px;height:78px;border-radius:50%;margin-bottom:26px;display:grid;place-items:center;
  font:italic 400 34px var(--serif);color:var(--fg);
  background:radial-gradient(circle at 35% 30%,#2a3544,#0f141b);
  border:1px solid rgba(224,49,63,.55);box-shadow:0 0 28px -6px rgba(179,18,31,.6)}
h1{font:italic 500 clamp(52px,14vw,68px)/1 var(--serif);letter-spacing:.01em}
.rule{width:38px;height:1px;margin:18px 0 22px;background:linear-gradient(90deg,var(--blood2),transparent)}
.bio{font-size:15.5px;color:#cdd5df;max-width:40ch}
.whisper{margin-top:16px;font:400 24px "Noto Serif SC","Songti SC","STSong","Noto Serif CJK SC",serif;letter-spacing:.3em;color:var(--muted);animation:fadein 3.5s ease 2.5s both}
@keyframes fadein{from{opacity:0}}
.find{margin-top:32px;padding-top:18px;border-top:1px solid var(--line)}
.label{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.link{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--fg);text-decoration:none;
  font-size:15px;font-weight:400;transition:color .3s,transform .3s}
.link small{color:var(--muted);font-size:13px;font-weight:300}
.link .dot{width:6px;height:6px;border-radius:50%;background:var(--blood);box-shadow:0 0 10px var(--blood2);animation:beat 2.8s ease-in-out infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}10%{transform:scale(1.7)}22%{transform:scale(1.05)}34%{transform:scale(1.45)}}
.link .arrow{margin-left:auto;color:var(--muted);transition:transform .3s,color .3s}
.link:hover{color:var(--blood2);transform:translateX(3px)}
.copy{background:none;border:0;width:100%;font:inherit;font-size:15px;font-weight:400;text-align:left;cursor:pointer}
a.link+a.link .dot{animation-delay:.5s}.copy .dot{animation-delay:1s}.copy+.copy .dot{animation-delay:1.5s}
.copy:hover .arrow{transform:none}
.cp{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
.link:hover .arrow{color:var(--blood2);transform:translate(2px,-2px)}
footer{margin-top:28px;font-size:10.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.fly{position:absolute;left:84%;top:40%;z-index:4;width:56px;height:46px;margin:-23px 0 0 -28px;pointer-events:none;opacity:0;animation:appear 15s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(190,20,35,.55))}
.fly svg{width:100%;height:100%}
@keyframes appear{
  0%{opacity:0;left:60%;top:60%;transform:rotate(-24deg) scale(.55)}
  7%{opacity:1}
  26%{left:76%;top:50%;transform:rotate(14deg) scale(1)}
  46%{left:84%;top:40%;transform:rotate(-8deg) scale(1)}
  64%{opacity:1;left:88%;top:34%;transform:rotate(10deg) scale(1)}
  80%{opacity:0;left:93%;top:24%;transform:rotate(26deg) scale(.85)}
  100%{opacity:0;left:93%;top:24%;transform:rotate(26deg) scale(.85)}}
.wing{transform-box:view-box;transform-origin:50px 40px;animation:flap .42s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.22)}}
@media (prefers-reduced-motion:reduce){
  .card,.mist,.petal,.fly,.wing,.dot,.whisper{animation:none}
  .fly{opacity:.9}
  .petal{display:none}
}
